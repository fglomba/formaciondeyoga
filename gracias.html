<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Gracias · Formación en Yoga Tradicional</title>
  <link rel="icon" href="assets/img/logo-fhs.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --crema: #F4ECE4; --marino: #1B376A; --tinta: #2E3A40; --azafran: #E2823D; --azafran-osc: #C96A28; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--crema); color: var(--tinta); font-family: "Jost", system-ui, sans-serif; font-size: 18px; line-height: 1.6; text-align: center; }
    main { max-width: 520px; }
    img { width: 84px; height: 84px; object-fit: contain; margin: 0 auto 18px; display: block; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; color: var(--marino); font-size: clamp(2.2rem, 8vw, 3rem); line-height: 1.1; margin: 0 0 12px; }
    p { margin: 0 0 26px; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 28px; border-radius: 999px; background: var(--azafran); color: var(--marino); font-weight: 600; font-size: 1.1rem; text-decoration: none; }
    a.btn:hover { background: var(--azafran-osc); }
    a.btn:focus-visible { outline: 3px solid var(--marino); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="assets/img/logo-fhs.png" width="84" height="84" alt="Fundación Holística de la Selva">
    <h1>¡Gracias!</h1>
    <p>Recibimos tu consulta.</p>
    <a class="btn" href="/">Volver a la página</a>
  </main>
</body>
</html>
